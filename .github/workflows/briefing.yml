name: World info Feishu briefing

on:
  schedule:
    # Queue well before 22:00 to avoid GitHub's top-of-hour congestion. The first
    # step waits until 22:00 and refuses overnight delivery if GitHub is late.
    - cron: '30 21 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: test
        type: choice
        options:
          - test
          - validate
          - briefing

permissions:
  contents: read

concurrency:
  group: world-info-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Decide scheduled delivery window
        id: delivery_window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hm="$(TZ=Asia/Shanghai date +%H%M)"
          local_minutes=$((10#${local_hm:0:2} * 60 + 10#${local_hm:2:2}))
          if (( local_minutes < 1285 || local_minutes > 1410 )); then
            echo "Scheduled run started outside 21:25-23:30 Asia/Shanghai; skipping delivery."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( local_minutes < 1320 )); then
            local_seconds="$(TZ=Asia/Shanghai date +%S)"
            wait_seconds=$(((1320 - local_minutes) * 60 - 10#$local_seconds))
            (( wait_seconds > 0 )) && sleep "$wait_seconds"
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.8.22'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --project vendor/TrendRadar --locked --no-dev

      - name: Restore delivery state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/state.json
          key: world-info-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            world-info-state-

      - name: Initialize delivery state
        shell: bash
        run: |
          mkdir -p output
          test -f output/state.json || cp config/initial-state.json output/state.json

      - name: Validate configuration and secret
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: vendor/TrendRadar/.venv/bin/python app.py ready

      - name: Send connection test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: vendor/TrendRadar/.venv/bin/python app.py test-notification

      - name: Collect and send briefing
        if: (github.event_name == 'schedule' && steps.delivery_window.outputs.send == 'true') || inputs.mode == 'briefing'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: vendor/TrendRadar/.venv/bin/python app.py run
