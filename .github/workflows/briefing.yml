name: World info Feishu briefing

on:
  schedule:
    # The primary run queues 77 minutes early and waits until 22:00. Three later
    # runs retry only when today's delivery state still shows a missing briefing.
    - cron: '43 20 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '11 22 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '41 22 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '11 23 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: test
        type: choice
        options:
          - test
          - validate
          - briefing

permissions:
  contents: read

concurrency:
  group: world-info-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Decide scheduled delivery window
        id: delivery_window
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hm="$(TZ=Asia/Shanghai date +%H%M)"
          local_minutes=$((10#${local_hm:0:2} * 60 + 10#${local_hm:2:2}))
          if (( local_minutes < 1235 || local_minutes > 1410 )); then
            echo "Scheduled run started outside 20:35-23:30 Asia/Shanghai; skipping delivery."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( local_minutes < 1320 )); then
            local_seconds="$(TZ=Asia/Shanghai date +%S)"
            wait_seconds=$(((1320 - local_minutes) * 60 - 10#$local_seconds))
            (( wait_seconds > 0 )) && sleep "$wait_seconds"
          fi
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Check out configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.8.22'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --project vendor/TrendRadar --locked --no-dev

      - name: Restore delivery state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/state.json
          key: world-info-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            world-info-state-

      - name: Initialize delivery state
        shell: bash
        run: |
          mkdir -p output
          test -f output/state.json || cp config/initial-state.json output/state.json

      - name: Check whether today's briefing still needs delivery
        id: delivery_needed
        if: steps.delivery_window.outputs.send == 'true'
        shell: bash
        run: |
          needed="$(vendor/TrendRadar/.venv/bin/python app.py delivery-needed)"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "Delivery needed: $needed"

      - name: Validate configuration and secret
        if: github.event_name == 'workflow_dispatch' || steps.delivery_needed.outputs.needed == 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: vendor/TrendRadar/.venv/bin/python app.py ready

      - name: Send connection test
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: vendor/TrendRadar/.venv/bin/python app.py test-notification

      - name: Collect and send AI briefing
        id: ai_briefing
        if: (github.event_name == 'schedule' && steps.delivery_window.outputs.send == 'true' && steps.delivery_needed.outputs.needed == 'true') || inputs.mode == 'briefing'
        continue-on-error: ${{ github.event_name == 'schedule' && github.event.schedule == '11 23 * * *' }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: vendor/TrendRadar/.venv/bin/python app.py run

      - name: Send non-AI fallback on the final retry
        id: degraded_fallback
        if: github.event_name == 'schedule' && github.event.schedule == '11 23 * * *' && steps.ai_briefing.outcome == 'failure'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: vendor/TrendRadar/.venv/bin/python app.py run-fallback

      - name: Notify final delivery failure
        if: always() && github.event_name == 'schedule' && github.event.schedule == '11 23 * * *' && steps.ai_briefing.outcome == 'failure' && steps.degraded_fallback.outcome == 'failure'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: vendor/TrendRadar/.venv/bin/python app.py notify-failure
